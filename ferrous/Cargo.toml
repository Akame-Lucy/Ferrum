[package]
name = "ferrous"
version = "0.2.0"
edition = "2021"
license = "MIT"
authors = ["Akame Lucy"]
# Internal to the workspace; Ferrum ships binaries, not crates.io libraries.
publish = false

[[bin]]
name = "ferrous-agent"
path = "src/main.rs"

[dependencies]
ferrum-core = { path = "../shared/ferrum-core" }
tokio = { version = "1.38", features = ["full"] }
snow = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
portable-pty = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive"] }
thiserror = "1.0"
argon2 = "0.5"
bytes = "1.6"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.28", features = ["user"] }
