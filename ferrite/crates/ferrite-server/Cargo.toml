[package]
name = "ferrite-server"
version.workspace = true
edition.workspace = true
license.workspace = true
# Internal to the workspace; Ferrum ships binaries, not crates.io libraries.
publish = false

[[bin]]
name = "ferrite"
path = "src/main.rs"

[dependencies]
ferrite-core = { path = "../ferrite-core" }
ferrite-pty = { path = "../ferrite-pty" }
ferrum-core = { path = "../../../shared/ferrum-core" }
axum = { version = "0.7", features = ["ws", "multipart"] }
tokio = { version = "1.38", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
bytes = "1.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rust-embed = "8.4"
clap = { version = "4.5", features = ["derive"] }
tower-http = { version = "0.5", features = ["cors", "trace", "set-header"] }
tower-cookies = "0.10"
argon2 = "0.5"
totp-lite = "2.0"
axum-server = { version = "0.8", features = ["tls-rustls"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
mime_guess = "2.0"
sha2 = "0.11"
sha1 = "0.10"
rand = "0.8"
zip = "2.1"
snow = "0.10"


