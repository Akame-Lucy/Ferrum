# Reverse proxy for Ferrite: TLS termination + a real hostname in front of
# a Ferrite bound to 127.0.0.1 (the default). Ferrite already sets CSP,
# X-Content-Type-Options and X-Frame-Options itself; this only adds what a
# backend process can't (HSTS, which must only ever be sent over a connection
# you know is really HTTPS) and the websocket upgrade nginx doesn't do by
# default.
#
# Get a certificate first, e.g. `certbot --nginx -d ferrite.example.com`,
# or point ssl_certificate/ssl_certificate_key at your own.

server {
    listen 80;
    listen [::]:80;
    server_name ferrite.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ferrite.example.com;

    ssl_certificate     /etc/letsencrypt/live/ferrite.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ferrite.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # File uploads: raise past nginx's 1m default to whatever you actually
    # want to allow through the browser uploader.
    client_max_body_size 512m;

    # /ws/terminal, /ws/collab, /ws/events all need the Upgrade handshake
    # passed through explicitly; nginx does not do this automatically like
    # Caddy does.
    location /ws/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Terminal/collab sessions are long-lived and mostly idle between
        # keystrokes; nginx's default 60s read timeout will otherwise kill
        # them mid-session.
        proxy_read_timeout 1d;
        proxy_send_timeout 1d;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Large file downloads stream through Ferrite already; don't force
        # nginx to buffer the whole response before sending it on.
        proxy_buffering off;
    }
}
